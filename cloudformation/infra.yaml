
AWSTemplateFormatVersion: '2010-09-09'

Description: Create an EC2 instance with Apache web server

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - test
      - prod

  InstanceType:
    Type: String
    Default: t3.micro

  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

  MyIP:
    Type: String
    Description: Your public IP address in CIDR notation, e.g. 203.0.113.10/32
    AllowedPattern: '(\d{1,3}\.){3}\d{1,3}/32'
    ConstraintDescription: Enter an IPv4 address ending in /32.

Resources:
  EC2SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTP and SSH from the specified IP
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref MyIP
      Tags:
        - Key: Name
          Value: !Sub '${Environment}-ec2-sg'

  MyEC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      SecurityGroupIds:
        - !GetAtt EC2SecurityGroup.GroupId
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          dnf update -y
          dnf install -y httpd
          systemctl enable --now httpd
          echo "<h1>Hello from ${Environment} EC2</h1>" > /var/www/html/index.html
      Tags:
        - Key: Name
          Value: !Sub '${Environment}-web-server'

Outputs:
  InstanceId:
    Description: EC2 instance ID
    Value: !Ref MyEC2Instance

  PublicIP:
    Description: EC2 public IP address
    Value: !GetAtt MyEC2Instance.PublicIp

  WebsiteURL:
    Description: Apache web server URL
    Value: !Sub 'http://${MyEC2Instance.PublicDnsName}'

  SecurityGroupId:
    Description: Security group ID
    Value: !GetAtt EC2SecurityGroup.GroupId
