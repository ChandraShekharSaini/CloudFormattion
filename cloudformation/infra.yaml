
AWSTemplateFormatVersion: '2010-09-09'

Description: >
  Complete AWS VPC Infrastructure with 2 Public Subnets,
  2 Private Subnets, 2 Public EC2, 2 Private EC2,
  Internet Gateway, NAT Gateway and Route Tables.

# =====================================================
# PARAMETERS
# =====================================================

Parameters:

  Environment:
    Description: Deployment environment
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - test
      - prod

  KeyName:
    Description: Existing EC2 Key Pair
    Type: AWS::EC2::KeyPair::KeyName

  InstanceType:
    Description: EC2 Instance Type
    Type: String
    Default: t2.micro
    AllowedValues:
      - t2.micro
      - t2.small
      - t3.micro
      - t3.small

  AMI:
    Description: Amazon Linux 2023 AMI ID for your region
    Type: AWS::EC2::Image::Id

  SSHLocation:
    Description: Your public IP in CIDR format
    Type: String
    Default: 0.0.0.0/0

# =====================================================
# RESOURCES
# =====================================================

Resources:

  # ===================================================
  # VPC
  # ===================================================

  MyVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub '${Environment}-VPC'
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: CloudFormattion
        - Key: ManagedBy
          Value: CloudFormation

  # ===================================================
  # INTERNET GATEWAY
  # ===================================================

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${Environment}-IGW'
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: CloudFormattion
        - Key: ManagedBy
          Value: CloudFormation

  AttachIGW:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref MyVPC
      InternetGatewayId: !Ref InternetGateway

  # ===================================================
  # PUBLIC SUBNET 1
  # ===================================================

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref MyVPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select
        - 0
        - !GetAZs ''
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${Environment}-Public-Subnet-1'
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: CloudFormattion
        - Key: ManagedBy
          Value: CloudFormation

  # ===================================================
  # PUBLIC SUBNET 2
  # ===================================================

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref MyVPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select
        - 1
        - !GetAZs ''
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${Environment}-Public-Subnet-2'
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: CloudFormattion
        - Key: ManagedBy
          Value: CloudFormation

  # ===================================================
  # PRIVATE SUBNET 1
  # ===================================================

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref MyVPC
      CidrBlock: 10.0.3.0/24
      AvailabilityZone: !Select
        - 0
        - !GetAZs ''
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${Environment}-Private-Subnet-1'
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: CloudFormattion
        - Key: ManagedBy
          Value: CloudFormation

  # ===================================================
  # PRIVATE SUBNET 2
  # ===================================================

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref MyVPC
      CidrBlock: 10.0.4.0/24
      AvailabilityZone: !Select
        - 1
        - !GetAZs ''
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${Environment}-Private-Subnet-2'
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: CloudFormattion
        - Key: ManagedBy
          Value: CloudFormation

  # ===================================================
  # PUBLIC ROUTE TABLE
  # ===================================================

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref MyVPC
      Tags:
        - Key: Name
          Value: !Sub '${Environment}-Public-RT'
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: CloudFormattion
        - Key: ManagedBy
          Value: CloudFormation

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachIGW
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1Association:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2Association:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  # ===================================================
  # ELASTIC IP
  # ===================================================

  NatEIP:
    Type: AWS::EC2::EIP
    DependsOn: AttachIGW
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub '${Environment}-NAT-EIP'
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: CloudFormattion
        - Key: ManagedBy
          Value: CloudFormation

  # ===================================================
  # NAT GATEWAY
  # ===================================================

  NatGateway:
    Type: AWS::EC2::NatGateway
    DependsOn: PublicRoute
    Properties:
      AllocationId: !GetAtt NatEIP.AllocationId
      SubnetId: !Ref PublicSubnet1
      ConnectivityType: public
      Tags:
        - Key: Name
          Value: !Sub '${Environment}-NAT-Gateway'
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: CloudFormattion
        - Key: ManagedBy
          Value: CloudFormation

  # ===================================================
  # PRIVATE ROUTE TABLE
  # ===================================================

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref MyVPC
      Tags:
        - Key: Name
          Value: !Sub '${Environment}-Private-RT'
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: CloudFormattion
        - Key: ManagedBy
          Value: CloudFormation

  PrivateRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  PrivateSubnet1Association:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnet2Association:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable

  # ===================================================
  # PUBLIC SECURITY GROUP
  # ===================================================

  PublicSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow SSH and HTTP access to public EC2
      VpcId: !Ref MyVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref SSHLocation

        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

      Tags:
        - Key: Name
          Value: !Sub '${Environment}-Public-SG'
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: CloudFormattion
        - Key: ManagedBy
          Value: CloudFormation

  # ===================================================
  # PRIVATE SECURITY GROUP
  # ===================================================

  PrivateSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow SSH from public EC2 instances
      VpcId: !Ref MyVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          SourceSecurityGroupId: !Ref PublicSecurityGroup

      Tags:
        - Key: Name
          Value: !Sub '${Environment}-Private-SG'
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: CloudFormattion
        - Key: ManagedBy
          Value: CloudFormation

  # ===================================================
  # PUBLIC EC2 INSTANCE 1
  # ===================================================

  PublicEC2_1:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AMI
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyName
      NetworkInterfaces:
        - DeviceIndex: '0'
          AssociatePublicIpAddress: true
          SubnetId: !Ref PublicSubnet1
          GroupSet:
            - !Ref PublicSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub '${Environment}-Public-EC2-1'
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: CloudFormattion
        - Key: ManagedBy
          Value: CloudFormation

  # ===================================================
  # PUBLIC EC2 INSTANCE 2
  # ===================================================

  PublicEC2_2:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AMI
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyName
      NetworkInterfaces:
        - DeviceIndex: '0'
          AssociatePublicIpAddress: true
          SubnetId: !Ref PublicSubnet2
          GroupSet:
            - !Ref PublicSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub '${Environment}-Public-EC2-2'
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: CloudFormattion
        - Key: ManagedBy
          Value: CloudFormation

  # ===================================================
  # PRIVATE EC2 INSTANCE 1
  # ===================================================

  PrivateEC2_1:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AMI
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyName
      NetworkInterfaces:
        - DeviceIndex: '0'
          AssociatePublicIpAddress: false
          SubnetId: !Ref PrivateSubnet1
          GroupSet:
            - !Ref PrivateSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub '${Environment}-Private-EC2-1'
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: CloudFormattion
        - Key: ManagedBy
          Value: CloudFormation

  # ===================================================
  # PRIVATE EC2 INSTANCE 2
  # ===================================================

  PrivateEC2_2:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AMI
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyName
      NetworkInterfaces:
        - DeviceIndex: '0'
          AssociatePublicIpAddress: false
          SubnetId: !Ref PrivateSubnet2
          GroupSet:
            - !Ref PrivateSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub '${Environment}-Private-EC2-2'
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: CloudFormattion
        - Key: ManagedBy
          Value: CloudFormation

# =====================================================
# OUTPUTS
# =====================================================

Outputs:

  VPCID:
    Description: Created VPC ID
    Value: !Ref MyVPC

  InternetGatewayID:
    Description: Internet Gateway ID
    Value: !Ref InternetGateway

  PublicSubnet1ID:
    Value: !Ref PublicSubnet1

  PublicSubnet2ID:
    Value: !Ref PublicSubnet2

  PrivateSubnet1ID:
    Value: !Ref PrivateSubnet1

  PrivateSubnet2ID:
    Value: !Ref PrivateSubnet2

  PublicRouteTableID:
    Value: !Ref PublicRouteTable

  PrivateRouteTableID:
    Value: !Ref PrivateRouteTable

  NatGatewayID:
    Value: !Ref NatGateway

  PublicSecurityGroupID:
    Value: !Ref PublicSecurityGroup

  PrivateSecurityGroupID:
    Value: !Ref PrivateSecurityGroup

  PublicEC2_1_IP:
    Description: Public EC2 1 Public IP
    Value: !GetAtt PublicEC2_1.PublicIp

  PublicEC2_2_IP:
    Description: Public EC2 2 Public IP
    Value: !GetAtt PublicEC2_2.PublicIp

  PrivateEC2_1_IP:
    Description: Private EC2 1 Private IP
    Value: !GetAtt PrivateEC2_1.PrivateIp

  PrivateEC2_2_IP:
    Description: Private EC2 2 Private IP
    Value: !GetAtt PrivateEC2_2.PrivateIp

  NATPublicIP:
    Description: NAT Gateway Elastic IP
    Value: !Ref NatEIP
