
AWSTemplateFormatVersion: '2010-09-09'

Description: >
  VPC with 2 Public Subnets, 2 Private Subnets,
  2 Public EC2, 2 Private EC2, IGW and NAT Gateway.

Parameters:

  KeyName:
    Description: Existing EC2 Key Pair
    Type: AWS::EC2::KeyPair::KeyName

  InstanceType:
    Description: EC2 Instance Type
    Type: String
    Default: t2.micro

  AMI:
    Description: Amazon Linux 2023 AMI ID for your region
    Type: AWS::EC2::Image::Id

  SSHLocation:
    Description: Your public IP in CIDR format (example 1.2.3.4/32)
    Type: String
    Default: 0.0.0.0/0

Resources:

  # ---------------- VPC ----------------

  MyVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: My-VPC

  # ---------------- INTERNET GATEWAY ----------------

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: My-IGW

  AttachIGW:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref MyVPC
      InternetGatewayId: !Ref InternetGateway

  # ---------------- PUBLIC SUBNETS ----------------

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref MyVPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: us-east-1a
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: Public-Subnet-1

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref MyVPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: us-east-1b
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: Public-Subnet-2

  # ---------------- PRIVATE SUBNETS ----------------

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref MyVPC
      CidrBlock: 10.0.3.0/24
      AvailabilityZone: us-east-1a
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: Private-Subnet-1

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref MyVPC
      CidrBlock: 10.0.4.0/24
      AvailabilityZone: us-east-1b
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: Private-Subnet-2

  # ---------------- PUBLIC ROUTE TABLE ----------------

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref MyVPC
      Tags:
        - Key: Name
          Value: Public-RT

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachIGW
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1Association:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2Association:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  # ---------------- ELASTIC IP ----------------

  NatEIP:
    Type: AWS::EC2::EIP
    DependsOn: AttachIGW
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: NAT-EIP

  # ---------------- NAT GATEWAY ----------------

  NatGateway:
    Type: AWS::EC2::NatGateway
    DependsOn: PublicRoute
    Properties:
      AllocationId: !GetAtt NatEIP.AllocationId
      SubnetId: !Ref PublicSubnet1
      Tags:
        - Key: Name
          Value: My-NAT-Gateway

  # ---------------- PRIVATE ROUTE TABLE ----------------

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref MyVPC
      Tags:
        - Key: Name
          Value: Private-RT

  PrivateRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  PrivateSubnet1Association:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnet2Association:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable

  # ---------------- PUBLIC SECURITY GROUP ----------------

  PublicSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow SSH and HTTP access to public EC2
      VpcId: !Ref MyVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref SSHLocation
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: Public-SG

  # ---------------- PRIVATE SECURITY GROUP ----------------

  PrivateSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow SSH from public EC2 only
      VpcId: !Ref MyVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          SourceSecurityGroupId: !Ref PublicSecurityGroup
      Tags:
        - Key: Name
          Value: Private-SG

  # ---------------- PUBLIC EC2 1 ----------------

  PublicEC2_1:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AMI
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyName
      NetworkInterfaces:
        - DeviceIndex: '0'
          AssociatePublicIpAddress: true
          SubnetId: !Ref PublicSubnet1
          GroupSet:
            - !Ref PublicSecurityGroup
      Tags:
        - Key: Name
          Value: Public-EC2-1

  # ---------------- PUBLIC EC2 2 ----------------

  PublicEC2_2:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AMI
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyName
      NetworkInterfaces:
        - DeviceIndex: '0'
          AssociatePublicIpAddress: true
          SubnetId: !Ref PublicSubnet2
          GroupSet:
            - !Ref PublicSecurityGroup
      Tags:
        - Key: Name
          Value: Public-EC2-2

  # ---------------- PRIVATE EC2 1 ----------------

  PrivateEC2_1:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AMI
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyName
      NetworkInterfaces:
        - DeviceIndex: '0'
          AssociatePublicIpAddress: false
          SubnetId: !Ref PrivateSubnet1
          GroupSet:
            - !Ref PrivateSecurityGroup
      Tags:
        - Key: Name
          Value: Private-EC2-1

  # ---------------- PRIVATE EC2 2 ----------------

  PrivateEC2_2:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AMI
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyName
      NetworkInterfaces:
        - DeviceIndex: '0'
          AssociatePublicIpAddress: false
          SubnetId: !Ref PrivateSubnet2
          GroupSet:
            - !Ref PrivateSecurityGroup
      Tags:
        - Key: Name
          Value: Private-EC2-2

Outputs:

  VPCID:
    Description: VPC ID
    Value: !Ref MyVPC

  PublicSubnet1ID:
    Value: !Ref PublicSubnet1

  PublicSubnet2ID:
    Value: !Ref PublicSubnet2

  PrivateSubnet1ID:
    Value: !Ref PrivateSubnet1

  PrivateSubnet2ID:
    Value: !Ref PrivateSubnet2

  NATGatewayID:
    Value: !Ref NatGateway

  PublicEC2_1_IP:
    Value: !GetAtt PublicEC2_1.PublicIp

  PublicEC2_2_IP:
    Value: !GetAtt PublicEC2_2.PublicIp

  PrivateEC2_1_IP:
    Value: !GetAtt PrivateEC2_1.PrivateIp

  PrivateEC2_2_IP:
    Value: !GetAtt PrivateEC2_2.PrivateIp
